[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-audio-reconstruction"
version = "0.1.0"
description = "EEG-conditioned audio reconstruction with a compact latent diffusion model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "librosa>=0.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.3",
  "torchaudio>=2.3",
  "tqdm>=4.66",
  "yt-dlp>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

